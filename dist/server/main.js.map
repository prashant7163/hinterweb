<div class="fullscreen-bg">
  <video loop muted autoplay poster="/assets/images/videoframe.jpg" class="fullscreen-bg__video" *ngIf="isApple==false">
      <source src="/assets/video/hinter_r03.mp4" type="video/mp4">
  </video>

  <div *ngIf="isApple" style="padding: 50px;">
    <div style="text-align: center;margin-bottom: 20px;">
        <a href="https://goo.gl/fGGi8d">  <img style="width:100%;min-height: 200px;"
        src="/assets/images/logo.png"/></a>
    </div>
    <div style="text-align: center;margin-bottom: 20px;"> <a href="https://goo.gl/fGGi8d"><img  style="width:100%;"  
      src="/assets/images/app_store_logo.png"/></a>

    </div>
   
  </div>
</div>
