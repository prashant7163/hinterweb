<div class="main-container">

    <div class="main-header-container ">

        <div class="row">
            <div class="col-sm-4">
                <span style="display: inline-block;margin-right: 10px;">
                    <img src="/assets/images/icons/hinter_header_logo.png" width="25px" />
                </span>

                <span class="header-item" [ngClass]="getSelectedHeader(0)" (click)="headerClickHandler(0)">
                    Home
                </span>

                <span class="header-item" [ngClass]="getSelectedHeader(1)">
                    About Us
                </span>
            </div>
            <div class="col-sm-4" style="text-align: center;">
                <span class="header-search-box">
                    <span class="header-search-box-text">
                        Search Experience..
                    </span>
                    <span>
                        <img src="/assets/images/icons/ico_search.png" width="15px" />
                    </span>
                </span>
            </div>
            <div class="col-sm-4" style="text-align: right;">
                <span class="header-create-exp-container">
                    <span>
                        Create Exp
                    </span>
                    <span>
                        <img src="/assets/images/icons/ico_pen.png" width="15px" />
                    </span>
                </span>
                <span class="header-create-login-container">
                    Log in
                </span>

            </div>
        </div>
    </div>

    <div class="main-data-container">
        <router-outlet></router-outlet>
    </div>

</div>

<div class="loader-main-container" *ngIf="showLoader">
    <img src="/assets/images/icons/loader.gif" style="height:100px;" />
</div>
