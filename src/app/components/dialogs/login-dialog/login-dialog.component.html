<div class="main-dialog-contianer">
    <div class="dialog-header-box">
        <img src="/assets/images/icons/ico_close.png" class="dialog-header-icon" (click)="closeDialogHandler()" />
    </div>
    <div class="dialog-header-text-container">
        <div class="dilaog-header-text1">
            Join Hinter
        </div>
        <div class="dilaog-header-text2">
            Create and share your experience to inspire others and get inspiration, for better decisions in your life.
        </div>
    </div>
    <div class="dialog-login-body">

        <div class="dialog-login-input-container">
            <span class="dialog-body-icon-container">
                <img src="/assets/images/icons/ico_email_white.png" class="dialog-body-icon" />
            </span>
            <span class="dialog-body-input-container">
                <input type="text" placeholder="Email Address" class="dialog-body-input" />
            </span>
        </div>

        <div class="dialog-login-input-container">
            <span class="dialog-body-icon-container">
                <img src="/assets/images/icons/ico_password_white.png" class="dialog-body-icon" />
            </span>
            <span class="dialog-body-input-container">
                <input type="password" placeholder="Password" class="dialog-body-input" />
            </span>
        </div>

        <div class="dialog-login-button-container">
            <div class="dialog-login-button">
                Log In
            </div>
        </div>

        <div class="dialog-sign-up-container">
            <span>
                Don't have an account?<span style="color: #ff3939;display: inline-block;margin-left: 5px;">Sign Up</span>
            </span>
            <div class=" dialog-sign-up-icons">
                <div class="dialog-sign-up-icon" style="text-align: center;">
                    <img src="/assets/images/icons/ico_fb_blue.png" class="dialog-body-icon" />
                </div>
                <div class="dialog-sign-up-icon" style="text-align: center;">
                    <img src="/assets/images/icons/ico_gop_blue.png" class="dialog-body-icon" />
                </div>
                <div class="dialog-sign-up-icon" style="text-align: center;">
                    <img src="/assets/images/icons/ico_twitter_blue.png" class="dialog-body-icon" />
                </div>
            </div>
        </div>

        <div class="dialog-footer-container">
            <span>
                Don't forget to check Our App here
            </span>
            <div class=" dialog-footer-icons">
                <div class="dialog-footer-icon" style="text-align: center;width: 40%;">
                        <img src="/assets/images/icons/ico_play_store.png" style="width: 100%;" />
                </div>
                <div class="dialog-footer-icon" style="text-align: center;width: 40%;">
                        <img src="/assets/images/icons/ico_app_store.png" style="width: 100%;" />
                </div>
            </div>
        </div>
    </div>
</div>
